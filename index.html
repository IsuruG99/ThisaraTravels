<!DOCTYPE html>
<html>

<head>
    <title>Firebase Click Test</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <button id="clickBtn">Click Me!</button>
        <p id="displayNum" style="display:none;"></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebaseConfig.js"></script>

    <script>
        const db = firebase.database();

        const btn = document.getElementById('clickBtn');
        const output = document.getElementById('displayNum');
        let shown = false;

        btn.addEventListener('click', () => {
            if (!shown) {
                db.ref('test/number').once('value').then(snapshot => {
                    if (snapshot.exists()) {
                        output.textContent = `Fetched Number from Firebase: ${snapshot.val()}`;
                        output.style.display = 'block';
                        shown = true;
                    } else {
                        output.textContent = 'No data found in Firebase.';
                        output.style.display = 'block';
                    }
                });
            } else {
                output.style.display = 'none';
                shown = false;
            }
        });
    </script>
</body>

</html>
